name: "metascope_val"
version: "0.1.0"
config-version: 2

profile: "metascope_val"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Fonte única da janela: os marts de análise (D16) e a coleta (`ingestion/config.py`) leem daqui.
vars:
  analysis_window_months: 12  # regra inviolável: nunca hardcode a janela
  elo_warmup_months: 6        # aquecimento do Elo antes da janela; também o corte de `tabs=all`
  # Visão recente, alternativa da janela no site (Análises e Meta): o momento atual, com menos
  # dado. Recorte dentro da janela de análise, nunca no lugar dela.
  recent_window_months: 3
  # Ranking Elo: time com menos séries do próprio tier na janela fica "provisório" (rating
  # ainda assentando, ex.: promovido da VCL ao VCT). Só sinaliza: o rating é o mesmo.
  rating_provisional_series: 10
  # Data de referência da janela. Nula: hoje. O CI de fixtures fixa (AS_OF_DATE) para o resultado
  # não mudar com o relógio. Ver macros/window.sql.
  as_of_date: null
  # D13: diferença aceita, em pontos percentuais, contra o agregado arredondado do vlr.gg.
  validation_tolerance_pp: 1

models:
  metascope_val:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    # D16: marts de análise (`mart_*`), filtrados pela janela; testes no _analysis_models.yml.
    analysis:
      +materialized: table
      +schema: analysis
