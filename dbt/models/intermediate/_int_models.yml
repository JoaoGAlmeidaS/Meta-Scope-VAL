version: 2

models:
  - name: int_team_matches
    description: "Uma linha por time por partida, com o nome da época."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id]
    columns:
      - name: team_id
        data_tests: [not_null]

  - name: int_team_domestic_events
    description: "Participações em eventos domésticos (VCT/VCL, após overrides): fonte da região do time."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [team_id, event_id]
    columns:
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["americas", "emea", "pacific", "china"]

  - name: int_team_match_regions
    description: >
      Região de cada time em cada partida: a do evento doméstico mais recente que ele começou a
      disputar até a partida; sem nenhum, a do primeiro depois (regra do D8).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id]

  - name: int_event_completeness
    description: >
      Completude da coleta por evento (D13): partidas concluídas listadas × gravadas × rejeitadas.
      `is_complete` libera o evento para a validação cruzada.
    columns:
      - name: event_id
        data_tests: [unique, not_null]

  - name: int_event_validation
    description: >
      Validação cruzada com o gabarito do vlr.gg (D13), por evento × mapa: mapas jogados,
      % de rounds no ataque e % de composições com cada agente, contra o agregado arredondado.
      Só eventos completos no lake. O teste assert_event_validation_within_tolerance cobra.
    columns:
      - name: check_name
        data_tests:
          - accepted_values:
              arguments:
                values: ["maps_played", "attack_win_rate", "pick_rate"]

unit_tests:
  - name: validacao_arredonda_antes_de_comparar_com_o_gabarito
    description: >
      O gabarito é inteiro arredondado: 66,7% nosso contra 66 dele passa com tolerância de 1 p.p.;
      67 contra 70 não passa. Overtime e round sem lado ficam fora do % de ataque. Evento
      incompleto não entra, nem evento excluído pelo seed (e3). Mapa refeito por lobby remake
      (m3): vale a leitura sem ele, que é a que bate com o gabarito; o vlr.gg ora conta, ora
      não conta esse mapa (pegadinha 36).
    model: int_event_validation
    given:
      - input: ref('int_event_completeness')
        rows:
          - {event_id: "e1", is_complete: true, has_gabarito: true}
          - {event_id: "e2", is_complete: false, has_gabarito: true}
          - {event_id: "e3", is_complete: true, has_gabarito: true}
      - input: ref('dim_event')
        rows:
          - {event_id: "e1", is_excluded: false}
          - {event_id: "e2", is_excluded: false}
          - {event_id: "e3", is_excluded: true}
      - input: ref('fct_map')
        rows:
          - {event_id: "e1", map_id: "m1", map_name: "Bind", has_complete_stats: true, is_showmatch: false}
          - {event_id: "e2", map_id: "m2", map_name: "Bind", has_complete_stats: true, is_showmatch: false}
          - {event_id: "e1", map_id: "m3", map_name: "Bind", has_complete_stats: false, is_showmatch: false}
          - {event_id: "e3", map_id: "m4", map_name: "Bind", has_complete_stats: true, is_showmatch: false}
      - input: ref('fct_round')
        rows:
          - {map_id: "m1", round_number: 1, winner_side: "attack"}
          - {map_id: "m1", round_number: 2, winner_side: "attack"}
          - {map_id: "m1", round_number: 3, winner_side: "defense"}
          - {map_id: "m1", round_number: 4, winner_side: null}
          - {map_id: "m1", round_number: 25, winner_side: "defense"}
          - {map_id: "m2", round_number: 1, winner_side: "attack"}
          - {map_id: "m3", round_number: 1, winner_side: "attack"}
      - input: ref('fct_player_map')
        rows:
          - {map_id: "m1", team_id: "A", agent: "sova"}
          - {map_id: "m1", team_id: "B", agent: "omen"}
          - {map_id: "m1", team_id: null, agent: "jett"}
          - {map_id: "m2", team_id: "A", agent: "sova"}
          - {map_id: "m3", team_id: "A", agent: "jett"}
      - input: ref('stg_event_agents')
        rows:
          - {event_id: "e1", map_name: "Bind", maps_played: 1, attack_win_rate_pct: 66, agent: "sova", pick_rate_pct: 50}
          - {event_id: "e1", map_name: "Bind", maps_played: 1, attack_win_rate_pct: 66, agent: "omen", pick_rate_pct: 49}
          - {event_id: "e1", map_name: "All", maps_played: 1, attack_win_rate_pct: 70, agent: "sova", pick_rate_pct: 50}
          - {event_id: "e1", map_name: "All", maps_played: 1, attack_win_rate_pct: 70, agent: "omen", pick_rate_pct: 50}
          - {event_id: "e2", map_name: "Bind", maps_played: 9, attack_win_rate_pct: 0, agent: "sova", pick_rate_pct: 0}
          - {event_id: "e3", map_name: "Bind", maps_played: 9, attack_win_rate_pct: 0, agent: "sova", pick_rate_pct: 0}
    expect:
      rows:
        - {event_id: "e1", map_name: "Bind", check_name: "maps_played", agent: null, diff: 0, is_within_tolerance: true}
        - {event_id: "e1", map_name: "All", check_name: "maps_played", agent: null, diff: 0, is_within_tolerance: true}
        - {event_id: "e1", map_name: "Bind", check_name: "attack_win_rate", agent: null, diff: 1, is_within_tolerance: true}
        - {event_id: "e1", map_name: "All", check_name: "attack_win_rate", agent: null, diff: -3, is_within_tolerance: false}
        - {event_id: "e1", map_name: "Bind", check_name: "pick_rate", agent: "sova", diff: 0, is_within_tolerance: true}
        - {event_id: "e1", map_name: "Bind", check_name: "pick_rate", agent: "omen", diff: 1, is_within_tolerance: true}
        - {event_id: "e1", map_name: "All", check_name: "pick_rate", agent: "sova", diff: 0, is_within_tolerance: true}
        - {event_id: "e1", map_name: "All", check_name: "pick_rate", agent: "omen", diff: 0, is_within_tolerance: true}
        # jett só existe no mapa refeito: na leitura sem ele, 0 contra 0.
        - {event_id: "e1", map_name: "Bind", check_name: "pick_rate", agent: "jett", diff: 0, is_within_tolerance: true}
        - {event_id: "e1", map_name: "All", check_name: "pick_rate", agent: "jett", diff: 0, is_within_tolerance: true}


  - name: regiao_do_time_e_a_do_evento_domestico_mais_recente
    description: >
      Time que migra de região: vale a região do evento doméstico mais recente até a partida.
      Numa partida internacional antes de qualquer evento doméstico, vale o primeiro depois.
    model: int_team_match_regions
    given:
      - input: ref('int_team_matches')
        rows:
          - {match_id: "m0", team_id: "t1", match_at: "2025-01-10 12:00:00"}
          - {match_id: "m1", team_id: "t1", match_at: "2025-02-10 12:00:00"}
          - {match_id: "m2", team_id: "t1", match_at: "2025-07-10 12:00:00"}
          - {match_id: "m3", team_id: "t1", match_at: "2025-08-10 12:00:00"}
      - input: ref('int_team_domestic_events')
        rows:
          - {team_id: "t1", event_id: "e_na", region: "americas", first_match_at: "2025-02-01 00:00:00"}
          - {team_id: "t1", event_id: "e_eu", region: "emea", first_match_at: "2025-07-01 00:00:00"}
    expect:
      rows:
        - {match_id: "m0", team_id: "t1", team_region: "americas", is_region_from_later_event: true}
        - {match_id: "m1", team_id: "t1", team_region: "americas", is_region_from_later_event: false}
        - {match_id: "m2", team_id: "t1", team_region: "emea", is_region_from_later_event: false}
        - {match_id: "m3", team_id: "t1", team_region: "emea", is_region_from_later_event: false}
