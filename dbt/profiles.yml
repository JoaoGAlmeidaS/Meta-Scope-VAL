# DuckDB como engine, não como banco: o arquivo é descartável, recriado a cada build e apagado no
# `make clean`. Os caminhos são relativos a `dbt/`: rode o dbt de dentro da pasta (o Makefile e o
# dagster-dbt fazem isso).
metascope_val:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'metascope.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC  # `timestamptz` do lake vira `timestamp` em UTC, nunca no fuso da máquina
