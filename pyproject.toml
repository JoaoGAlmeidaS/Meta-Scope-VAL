[project]
name = "metascope-val"
version = "0.1.0"
description = "Analise estatistica do cenario competitivo de VALORANT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # coleta
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "hishel>=0.0.30",
    # dados
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    # warehouse
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # orquestracao
    "dagster>=1.8",
    "dagster-dbt>=0.24",
    "dagster-webserver>=1.8",
    # analise
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    # ml
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    # site
    "jinja2>=3.1",
    # lake
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
    "jupyter>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "pipeline/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ingestion/vendor", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "ingestion/vendor"
