name: build

# Dois trilhos (decisão do D14):
#   test   todo push e PR, sem segredo: lint, pytest e o build inteiro (Dagster → dbt → testes)
#          sobre o lake gerado dos fixtures do repositório.
#   build  manual (e semanal a partir do D29): lake real do Hugging Face, coleta incremental,
#          warehouse e linhagem. Precisa do segredo HF_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # D29: ligar o schedule semanal quando o pipeline estabilizar.
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Ambiente
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Pacotes do dbt
        run: make dbt-deps

      - name: Testes
        run: make test

      - name: Build do zero sobre o lake de fixtures
        run: make build-fixtures

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: build-real
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_LAKE_REPO: ${{ vars.HF_LAKE_REPO }}  # opcional; vazio = <usuário do token>/meta-scope-val-lake
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Ambiente
        run: uv sync --frozen

      - name: Conferir o segredo
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Segredo HF_TOKEN ausente (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Baixar o lake
        run: make lake-pull

      # Só carga incremental no CI: o histórico roda local, uma vez. Se o vlr.gg bloquear os IPs
      # do Actions, o build segue com o lake baixado (e o lake remoto não é tocado).
      - name: Coleta incremental (temporada corrente)
        id: ingest
        continue-on-error: true
        run: make ingest

      - name: Enviar o lake
        if: steps.ingest.outcome == 'success'
        run: make lake-push

      - name: Warehouse e linhagem
        run: make build

      - name: Guardar dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # D29: publicação no GitHub Pages (dbt docs em /lineage e o site), junto com o schedule.
