name: build

# Dois trilhos (decisão do D14):
#   test    todo push e PR, sem segredo: lint, pytest e o build inteiro (Dagster → dbt → testes →
#           site) sobre o lake gerado dos fixtures do repositório.
#   build   manual ou semanal: lake real do Hugging Face, coleta incremental, warehouse, site e
#           linhagem. Precisa do segredo HF_TOKEN.
#   deploy  D29: publica dist/ no GitHub Pages depois do build real.
#
# Publicação guardada pela variável do repositório PAGES_ENABLED (Settings → Secrets and
# variables → Actions → Variables). Sem ela = "true", o schedule não dispara o build real e nada
# publica; o passo a passo está em docs/projeto-valorant-data.md (D29).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # segunda, 06:00 UTC: depois das partidas do fim de semana

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        # versão inteira: desde a v8 o setup-uv não publica tag de major (@v10 não existe)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Ambiente
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Pacotes do dbt
        run: make dbt-deps

      - name: Testes
        run: make test

      - name: Build do zero sobre o lake de fixtures
        run: make build-fixtures

  build:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: build-real
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_LAKE_REPO: ${{ vars.HF_LAKE_REPO }}  # opcional; vazio = <usuário do token>/meta-scope-val-lake
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        # versão inteira: desde a v8 o setup-uv não publica tag de major (@v10 não existe)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Ambiente
        run: uv sync --frozen

      - name: Conferir o segredo
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Segredo HF_TOKEN ausente (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Baixar o lake
        run: make lake-pull

      # Só carga incremental no CI: o histórico roda local, uma vez. Se o vlr.gg bloquear os IPs
      # do Actions, o build segue com o lake baixado (e o lake remoto não é tocado).
      - name: Coleta incremental (temporada corrente)
        id: ingest
        continue-on-error: true
        run: make ingest

      - name: Enviar o lake
        if: steps.ingest.outcome == 'success'
        run: make lake-push

      - name: Warehouse, site e linhagem
        run: make build

      - name: Guardar dist/
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Empacotar o site para o Pages
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
