repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  # ruff e black pelo `uv run`: as mesmas versões do uv.lock que o `make lint` e o CI usam (antes,
  # o ruff do pre-commit era outra versão e ordenava imports de outro jeito: o 1º CI falhou nisso).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: "^notebooks/"
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        exclude: "^notebooks/"
